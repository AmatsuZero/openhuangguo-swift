name: hg-xcf

# 构建 OpenHuangguoCore.xcframework 并在**本独立仓库**发布二进制 release。
# 不写任何 hongguo 文件，也不触发源仓库的 release.yml。
# 触发：hg-xcf-v* 标签 / 手动。
on:
  push:
    tags: ['hg-xcf-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "资产 tag，如 hg-xcf-v0.1.0"
        required: true
        default: "hg-xcf-v0.1.0"

permissions:
  contents: write

env:
  GOMOBILE_VERSION: v0.0.0-20261011034528-197770444867

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  # Android 完整壳 AAR 在 Linux runner 构建（避开紧张的 macOS runner），
  # 产物经 artifact 传给 release job 与 xcframework 一起发布。
  build-aar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: bindings/huangguo/core/go.mod
          cache-dependency-path: bindings/huangguo/core/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@$GOMOBILE_VERSION golang.org/x/mobile/cmd/gobind@$GOMOBILE_VERSION
          gomobile init
      - name: Build Android AAR (full shell + core)
        run: bindings/huangguo/build.sh android
      - name: Upload AAR
        uses: actions/upload-artifact@v7
        with:
          name: huangguo-aar
          # build.sh 把 gradle 完整壳 AAR 改名为 openhuangguo-release.aar：
          # 含 Kotlin 壳 OpenHuangguoClient + core.jar + jni，消费者可直接用 Kotlin API。
          path: bindings/huangguo/android/build/outputs/aar/openhuangguo-release.aar
          if-no-files-found: error

  release:
    needs: [verify, build-aar]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: bindings/huangguo/core/go.mod
          cache-dependency-path: bindings/huangguo/core/go.sum

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@$GOMOBILE_VERSION golang.org/x/mobile/cmd/gobind@$GOMOBILE_VERSION
          gomobile init

      - name: Build xcframework
        run: bindings/huangguo/build.sh ios

      - name: Zip + checksum
        id: pkg
        run: |
          cd bindings/huangguo/build
          # Preserve macOS versioned-framework symlinks. Dereferencing them
          # produces an archive that builds but fails SwiftPM test signing.
          zip -yr OpenHuangguoCore.xcframework.zip OpenHuangguoCore.xcframework
          VERIFY_DIR="$RUNNER_TEMP/hg-archive-verify"
          unzip -q OpenHuangguoCore.xcframework.zip -d "$VERIFY_DIR"
          test -L "$VERIFY_DIR/OpenHuangguoCore.xcframework/macos-arm64_x86_64/OpenHuangguoCore.framework/Versions/Current"
          test -f "$VERIFY_DIR/OpenHuangguoCore.xcframework/macos-arm64_x86_64/OpenHuangguoCore.framework/OpenHuangguoCore"
          CK=$(shasum -a 256 OpenHuangguoCore.xcframework.zip | awk '{print $1}')
          echo "checksum=$CK" >> "$GITHUB_OUTPUT"

      - name: Download Android AAR
        uses: actions/download-artifact@v7
        with:
          name: huangguo-aar
          path: bindings/huangguo/build

      - name: Backfill Package.swift in a clean worktree on latest main
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          CHECKSUM: ${{ steps.pkg.outputs.checksum }}
        run: |
          # 构建与 zip 都在已验证的标签 checkout 上完成（产物保留在原工作区）；
          # 回填与提交在独立 worktree 的最新 main 上进行，
          # 避免"标签上改了 Package.swift → checkout -B main 被未提交改动阻止"导致发布中断。
          WORKTREE="$RUNNER_TEMP/hg-backfill-main"
          git fetch origin main
          git worktree add --detach "$WORKTREE" origin/main
          # 回填脚本按自身路径定位 ../Package.swift，需在 worktree 根目录运行其副本。
          mkdir -p "$WORKTREE/scripts"
          cp scripts/fix_huangguo_binarytarget.py "$WORKTREE/scripts/"
          (cd "$WORKTREE" && python3 scripts/fix_huangguo_binarytarget.py "$TAG" "$CHECKSUM")
          git -C "$WORKTREE" config user.email "ci@openhuangguo.local"
          git -C "$WORKTREE" config user.name "openhuangguo-ci"
          git -C "$WORKTREE" add Package.swift
          git -C "$WORKTREE" commit -m "ci: point binaryTarget at ${TAG}" || echo "no change"
          git -C "$WORKTREE" push origin HEAD:main

      # README 消费契约：Android 用 release 的 huangguo-release.aar。
      - name: Rename AAR to consumer-facing name
        run: mv bindings/huangguo/build/openhuangguo-release.aar bindings/huangguo/build/huangguo-release.aar

      - name: Publish binary release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: OpenHuangguoCore ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            OpenHuangguoCore.xcframework (iOS + macOS slices) + huangguo-release.aar
            (Android full shell: Kotlin OpenHuangguoClient + core.jar + jni), built with gomobile.
            Binary asset tag; SwiftPM consumers use the standard semver tag vX.Y.Z.
          files: |
            bindings/huangguo/build/OpenHuangguoCore.xcframework.zip
            bindings/huangguo/build/huangguo-release.aar
          make_latest: false
